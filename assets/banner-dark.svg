<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">malu</title>
  <desc id="d">Um galho delicado com folhas rosadas cresce da esquerda para a direita; a raiz vira trilhas de circuito e pequenos pontos formam uma linha de dados que sobe.</desc>
  <style>
    .tinta { stroke: #F8C8DC; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .folha { fill: #3a2a31; stroke: #F8C8DC; stroke-width: 1.5; stroke-linejoin: round; }
    .nervura { stroke: #F8C8DC; stroke-width: 1.1; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .no { fill: #1f1f1f; stroke: #F8C8DC; stroke-width: 1.5; }
    .solda { fill: #F8C8DC; }
    .dados { stroke: #F8C8DC; stroke-width: 1.2; fill: none; stroke-dasharray: 1 7; stroke-linecap: round; opacity: .8; }
    .cheio { fill: #F8C8DC; }
    .suave { fill: #F8C8DC; stroke: #F8C8DC; stroke-width: 1; }
  </style>
  <rect x="0" y="0" width="1200" height="300" rx="28" fill="#1f1f1f"/>
  <!-- raiz que vira trilhas de circuito -->
