  <g transform="translate(323.9 200.7) rotate(26.8) scale(0.9)"><g><path class="folha" d="M0 0 C 14 -15, 40 -17, 58 0 C 40 17, 14 15, 0 0 Z"/><path class="nervura" d="M2 0 Q 30 -2 56 0"/></g></g>
